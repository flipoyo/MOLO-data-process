# Runs the tests of molonari-pipeline on every push and pull request, in the pixi environment of this repository.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.66.0
          locked: true
      - name: Check that every file holds the version of pixi.toml
        run: pixi run check-version
      - name: Run the tests
        run: pixi run test
