[project]
name = "molonari-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas"]

[project.optional-dependencies]
dev = ["protobuf"]
mqtt = ["paho-mqtt>=2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["raw_to_processed"]
